name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: Describe the need first, then the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
      description: How do other clients (Plex, Infuse, the Jellyfin web client…) handle it?
