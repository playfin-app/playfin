# Xcode project specification for Playfin, processed by XcodeGen.
name: Playfin
options:
  bundleIdPrefix: com.playfin
  deploymentTarget:
    macOS: "14.0"

packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    exactVersion: 1.1.0-n9.0.2

targets:
  Playfin:
    type: application
    platform: macOS
    sources:
      - path: Playfin
        excludes:
          - "**/.claude"
      - path: Generated/playfin_core.swift
    dependencies:
      - package: MPVKit
        product: MPVKit
      - framework: PlayfinCore.xcframework
        embed: true
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: Network.framework
      - sdk: OpenGL.framework
      - sdk: QuartzCore.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playfin.app
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Playfin connects to your Jellyfin server on the local network."
        MARKETING_VERSION: "0.11.1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Playfin
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_NSHumanReadableCopyright: "Free software, MPL-2.0 licence. Independent client for Jellyfin."
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_NSSupportsAutomaticTermination: NO
        INFOPLIST_KEY_NSSupportsSuddenTermination: NO
        CODE_SIGN_IDENTITY: "-"
        GCC_PREPROCESSOR_DEFINITIONS: GL_SILENCE_DEPRECATION=1

  PlayfinTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - "**/.claude"
    dependencies:
      - target: Playfin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playfin.appTests
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"

schemes:
  Playfin:
    build:
      targets:
        Playfin: all
        PlayfinTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PlayfinTests
