[package]
name = "playfin_webos"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[features]
default = []
webos = []

[dependencies]
femtovg = "0.28"
glow = "0.18"
playfin_core = { path = "../core", default-features = false, features = ["ring-tls", "bundled-roots"] }
sdl2 = { version = "0.39", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.54", features = ["rt-multi-thread"] }

[profile.release]
lto = true
panic = "abort"
