[package]
name = "playfin_core"
version = "0.9.0"
edition = "2024"

[lib]
# lib: for the Rust test program
# staticlib: library linked into the macOS app
# cdylib: used by uniffi-bindgen to read the exported functions
crate-type = ["lib", "staticlib", "cdylib"]

# Tool that generates the Swift code (run by scripts/build-xcframework.sh)
[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
libc = "0.2"
log = "0.4"
reqwest = { version = "0.13.5", features = ["json", "query"] }
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
uniffi = { version = "0.32.2", features = ["tokio"] }
uuid = { version = "1.27.0", features = ["v4"] }

[profile.release]
lto = true
panic = "abort"

[dev-dependencies]
wiremock = "0.6.5"
