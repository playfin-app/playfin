name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please never paste server addresses, user names or tokens.
        Settings → Advanced → "Export diagnostics" creates a report without any secret.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open a series\n2. Press Play\n3. ..."
  - type: input
    id: app
    attributes:
      label: Playfin version
      description: Settings → About
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.3, MacBook Air M2
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Jellyfin server version
      placeholder: "10.10.3"
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional)
      description: Paste the exported diagnostics file content.
      render: text
